repos:
  # --- Ogólne ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  # --- Frontend: Prettier ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: node
        files: \.(ts|tsx|css|json|md)$
        exclude: ^frontend/src/components/ui/

  # --- Frontend: TypeScript type check ---
  - repo: local
    hooks:
      - id: tsc
        name: tsc
        entry: bash -c 'cd frontend && npx tsc -b --noEmit'
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

  # --- Backend: Ruff format + lint ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff-format
        files: ^backend/
      - id: ruff
        files: ^backend/
        args: [--fix]

  # --- Backend: ty type check ---
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: bash -c 'cd backend && uv run ty check app/ --exclude app/config.py'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
